<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233548">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Quotes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MB System Quotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; editor / quote preview / archive behind a bottom tab bar.
   The quote itself is a fixed A4 sheet (210 x 297 mm) in the brand's gold + navy. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1d2733; --muted:#6b7480; --line:#e2ddd2;
  --gold:#ae8037; --gold-soft:#f5ecdc; --navy:#233548; --on-navy:#ffffff;
  --danger:#b3412e; --danger-soft:#fbe9e5; --ok:#2e7d55;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a222c; --ink:#ebe6dc; --muted:#98a1ab; --line:#2b3542;
  --gold:#d3a35a; --gold-soft:#2c2619; --navy:#3a5574; --on-navy:#ffffff;
  --danger:#e57a64; --danger-soft:#3a201b; --ok:#5cc08b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin-inline:auto}
header.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top img{width:66px;height:44px;object-fit:contain}
header.top h1{font-family:var(--f-display);font-size:19px;font-weight:800;margin:0;line-height:1.2}
header.top p{margin:0;color:var(--muted);font-size:12.5px}
.langsw{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.langsw button{background:transparent;border:0;padding:7px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
section.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;min-height:62px}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
input[inputmode="decimal"]{direction:ltr;font-variant-numeric:tabular-nums}
[dir="rtl"] input[inputmode="decimal"]{text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:10px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#fff}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:28px 1fr;gap:8px 10px;background:var(--surface)}
.item.bad{border-color:var(--danger);background:var(--danger-soft)}
.item .n{font-family:var(--f-display);font-weight:700;color:var(--gold);text-align:center;padding-top:8px}
.item .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.item .row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.item .lt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:10px 4px;white-space:nowrap;direction:ltr;min-width:84px;text-align:end}
.item .msg{font-size:12px;color:var(--danger)}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 2px;cursor:pointer;justify-self:start}
.x:hover{color:var(--danger)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14.5px;border:1px solid transparent;min-height:44px;text-align:center}
.btn:focus-visible,.tab:focus-visible,.x:focus-visible,.seg button:focus-visible,.langsw button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--gold);color:#fff}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.add{border:1.5px dashed var(--line);background:transparent;color:var(--gold);font-weight:700}
.totalbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.totalbar .t{display:flex;flex-direction:column}
.totalbar .t span{font-size:12px;color:var(--muted)}
.totalbar .t strong{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.totalbar .acts{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.warn{font-size:13px;color:var(--danger)}
.editing{font-size:12.5px;background:var(--gold-soft);color:var(--ink);border-radius:9px;padding:8px 11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editing button{background:none;border:0;color:var(--gold);font-weight:700;padding:0}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.pvwrap{background:#d9d4ca;border-radius:var(--r);padding:10px;overflow:hidden;position:relative}
.pvscale{width:210mm;position:absolute;top:10px}
[dir="rtl"] .pvscale{right:10px;transform-origin:top right}
[dir="ltr"] .pvscale{left:10px;transform-origin:top left}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp .btn{width:100%}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer;color:var(--ink);width:100%}
.q:hover{border-color:var(--gold)}
.q .nm{font-family:var(--f-display);font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.q .am{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;white-space:nowrap}
.q .meta{font-size:12px;color:var(--muted)}
.q .tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px;color:var(--muted)}
.q .acts{grid-column:1/-1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.q .acts .btn{min-height:36px;padding:6px 12px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{background:none;border:0;padding:9px 4px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on b{background:var(--ok)}.sync.err b{background:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--danger)}

/* ===== Quote sheet: exactly A4 ===== */
.paper{--k:1;width:210mm;height:297mm;overflow:hidden;background:#fff;color:#1b2430;font-family:"Cairo","IBM Plex Sans Arabic",Arial,sans-serif;padding:12mm 13mm 10mm;display:flex;flex-direction:column;position:relative}
.paper[dir="ltr"]{font-family:"Cairo",Arial,sans-serif}
.paper .frame{position:absolute;inset:6mm;border:1.5px solid #ae8037;pointer-events:none}
.paper .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:2px solid #ae8037;padding-bottom:12px}
.paper .hd .ttl{text-align:center}
.paper .hd .ttl .a{font-size:32px;font-weight:800;color:#233548;line-height:1.2}
.paper .hd .ttl .b{font-size:19px;font-weight:800;color:#ae8037;line-height:1.3;font-family:Arial,sans-serif}
.paper .hd .ttl .c{font-size:11.5px;color:#5d6773;font-family:Arial,sans-serif}
.paper .hd .lg{justify-self:end}
.paper[dir="ltr"] .hd{direction:rtl}
.paper[dir="ltr"] .hd .ttl{direction:ltr}
.paper .hd .lg img{width:170px;height:110px;object-fit:contain;display:block}
.paper .main{font-size:calc(14px * var(--k));display:flex;flex-direction:column}
.paper .meta{display:flex;justify-content:space-between;gap:20px;padding:1.1em .3em .4em;font-size:1.07em}
.paper .meta b{color:#233548;margin-inline-start:6px}
.paper .greet{color:#3a4552;padding:.3em .3em .9em}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#f3ead9;color:#233548;font-weight:700;padding:.6em .55em;border-bottom:1.5px solid #ae8037;text-align:center}
.paper td{padding:.55em;border-bottom:1px solid #e6e1d6;text-align:center;font-variant-numeric:tabular-nums}
.paper td.d{text-align:start}
.paper td.num{direction:ltr}
.paper tr.blank td{height:2.55em}
.paper .tot{display:flex;align-items:center;justify-content:space-between;background:#f3ead9;border-top:2px solid #ae8037;padding:.85em 1.1em;margin-top:2px}
.paper .tot .l{font-weight:800;font-size:1.2em;color:#233548}
.paper .tot .v{font-weight:800;font-size:1.4em;color:#1b2430;direction:ltr;display:inline-flex;align-items:baseline;gap:8px}
.paper .tot .v small{font-size:.65em;color:#5d6773;font-weight:600}
.paper .nt{padding:1.1em .3em 0;font-size:.96em;color:#2c3540}
.paper .nt h4{margin:0 0 .4em;color:#ae8037;font-size:1.04em}
.paper .nt p{margin:0 0 .5em;line-height:1.65}
.paper .ft{margin-top:auto;border-top:1.5px solid #ae8037;padding-top:12px;display:flex;justify-content:space-between;gap:20px;font-size:13.5px}
.paper .ft .c1 div{font-weight:700}
.paper .ft .c1 .lab{font-family:Arial,sans-serif;font-weight:700;color:#233548;margin-bottom:4px}
.paper .ft .c1 .ph{direction:ltr;font-family:Arial,sans-serif}
.paper[dir="rtl"] .ft .c1 .ph{text-align:right}
.paper .ft .c1 a{color:#1f5fbf;text-decoration:none;font-weight:600}
.paper .ft .c2{text-align:end}
.paper .ft .c2 .s{color:#5d6773}
.paper .ft .c2 .bn{font-weight:800;color:#233548;font-family:Arial,sans-serif}

#sheetHost{position:fixed;top:0;left:-12000px;width:210mm}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*:not(#sheetHost){display:none!important}
  #sheetHost{position:static;left:auto;width:auto}
  .paper{height:296.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="hdLogo" alt="MB System">
    <div><h1 data-t="appTitle"></h1><p>MB System · Security Solutions</p></div>
    <div class="langsw" role="group" aria-label="Language">
      <button type="button" data-ui="ar">ع</button><button type="button" data-ui="en">EN</button>
    </div>
  </header>

  <!-- EDITOR -->
  <section class="view" id="v-edit">
    <div class="editing" id="editingBar" hidden><span id="editingTxt"></span><button id="btnNew2" type="button" data-t="startNew"></button></div>
    <div class="card">
      <h2 data-t="quoteInfo"></h2>
      <div class="grid2">
        <label class="f"><span data-t="client"></span><input id="fClient" autocomplete="off"></label>
        <label class="f"><span data-t="date"></span><input id="fDate" type="date"></label>
        <label class="f"><span data-t="currency"></span><input id="fCur" autocomplete="off"></label>
        <label class="f"><span data-t="fbName"></span><input id="fFb" autocomplete="off"></label>
      </div>
      <div style="margin-top:12px">
        <div class="f" style="font-size:12.5px;color:var(--muted);margin-bottom:4px" data-t="quoteLang"></div>
        <div class="seg" role="group"><button type="button" data-ql="ar">عربي</button><button type="button" data-ql="en">English</button></div>
      </div>
    </div>

    <div class="card">
      <h2><span data-t="items"></span><small data-t="autoTotal"></small></h2>
      <div class="items" id="items"></div>
      <button class="btn add block" id="btnAdd" type="button" style="margin-top:10px" data-t="addItem"></button>
    </div>

    <div class="card">
      <h2><span data-t="notes"></span><small data-t="notesHint"></small></h2>
      <div class="notes" id="notes"></div>
      <button class="btn add block" id="btnAddNote" type="button" style="margin-top:10px" data-t="addNote"></button>
    </div>

    <div class="card">
      <div class="totalbar">
        <div class="t"><span data-t="total"></span><strong id="sumTotal">0.00</strong></div>
        <div class="acts">
          <button class="btn ghost" id="btnPreview" type="button" data-t="preview"></button>
          <button class="btn gold" id="btnSave" type="button" data-t="save"></button>
        </div>
      </div>
      <div class="warn" id="warn" hidden></div>
      <button class="btn ghost block" id="btnNew" type="button" style="margin-top:10px" data-t="newQuote"></button>
    </div>
  </section>

  <!-- PREVIEW -->
  <section class="view" id="v-prev" hidden>
    <div class="exp">
      <button class="btn gold" id="btnShare" type="button" data-t="sendPdf"></button>
      <button class="btn navy" id="btnPrint" type="button" data-t="print"></button>
      <button class="btn ghost" id="btnPng" type="button" data-t="sendImg"></button>
      <button class="btn ghost" id="btnCopy" type="button" data-t="copyText"></button>
    </div>
    <div class="seg" role="group" aria-label="Quote language"><button type="button" data-ql="ar">عرض السعر بالعربي</button><button type="button" data-ql="en">Quotation in English</button></div>
    <div class="editing" id="driveBox" hidden><span data-t="driveSaved"></span><a id="driveLink" href="#" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700" data-t="openDrive"></a></div>
    <button class="btn ghost block" id="btnBack" type="button" data-t="back"></button>
    <p class="hint" data-t="prevHint"></p>
    <div class="pvwrap" id="pvwrap"><div class="pvscale" id="pvscale"></div></div>
  </section>

  <!-- ARCHIVE -->
  <section class="view" id="v-arch" hidden>
    <input id="fSearch" type="search" autocomplete="off">
    <div class="list" id="list"></div>
    <div class="card">
      <h2><span data-t="sheetTitle"></span><small class="sync" id="syncState"><b></b><span></span></small></h2>
      <p class="hint" style="margin-bottom:10px" data-t="sheetHint"></p>
      <label class="f"><span data-t="sheetUrl"></span><input id="fSheet" dir="ltr" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <div class="exp" style="margin-top:10px">
        <button class="btn navy" id="btnSheetSave" type="button" data-t="sheetConnect"></button>
        <button class="btn ghost" id="btnSync" type="button" data-t="syncNow"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="excelTitle"></h2>
      <p class="hint" style="margin-bottom:10px" data-t="excelHint"></p>
      <button class="btn gold block" id="btnExcel" type="button" data-t="excelBtn"></button>
    </div>
    <div class="card">
      <h2><span data-t="backup"></span><small data-t="backupSmall"></small></h2>
      <p class="hint" style="margin-bottom:10px" data-t="backupHint"></p>
      <div class="exp">
        <button class="btn navy" id="btnBackup" type="button" data-t="exportBackup"></button>
        <button class="btn ghost" id="btnRestore" type="button" data-t="restore"></button>
      </div>
      <input type="file" id="fRestore" accept=".json,application/json" hidden>
    </div>
  </section>
</div>

<div id="sheetHost" aria-hidden="true"></div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-v="edit" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-t="tabEdit"></span></button>
  <button class="tab" role="tab" data-v="prev" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span data-t="tabPrev"></span></button>
  <button class="tab" role="tab" data-v="arch" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M3 7l2-3h14l2 3M9 12h6"/></svg><span data-t="tabArch"></span></button>
</nav>

const SHEET={
 ar:{title:"عـرض سعـر",client:"اسم العميل /",date:"التاريخ:",greet:"تحية طيبة وبعد، نتشرف بتقديم عرض السعر التالي:",no:"م",desc:"البيان والمواصفات",qty:"الكمية",price:"السعر",total:"الإجمالي",

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dmy=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,٬]/g,"").replace("٫","."));return isNaN(n)?null:n};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}

let ui=ls("mbq-ui")||"ar";
const t=(k,...a)=>{const v=UI[ui][k];return typeof v==="function"?v(...a):v};

/* ---------- state ---------- */
function blank(lang,notes){lang=lang||"ar";return{id:null,lang,client:"",date:today(),currency:CUR[lang],fb:"MB Systems",items:[{d:"",q:"",p:""},{d:"",q:"",p:""},{d:"",q:"",p:""}],notes:(notes&&notes.length?notes:NOTES[lang]).slice()}}
let cur=ls("mbq-draft")||blank(ui);
if(!cur.lang)cur.lang="ar";
let saved=[]; let filter=""; let pendingDelete=null;

function rowState(it){
  const any=(it.d||"").trim()||it.q!==""||it.p!=="";
  if(!any)return{empty:true};
  const q=num(it.q),p=num(it.p);
  if(!(it.d||"").trim())return{msg:"needDesc"};
  if(q==null||p==null)return{msg:"needQP"};
  if(q<=0||p<0)return{msg:"checkQP"};
  return{ok:true,q,p,t:Math.round(q*p*100)/100};
}
function calc(){let total=0,bad=0,count=0;cur.items.forEach(it=>{const s=rowState(it);if(s.ok){total+=s.t;count++}else if(s.msg)bad++});return{total:Math.round(total*100)/100,bad,count}}
function persist(){ls("mbq-draft",cur)}

/* ---------- UI language ---------- */
function applyUI(){
  document.documentElement.lang=ui;document.documentElement.dir=ui==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-ui]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.ui===ui)));
  $("#fSearch").placeholder=t("search");$("#fClient").placeholder=t("clientPh");
  renderEditor();renderList();if(!$("#v-prev").hidden)renderPreview();
}
document.querySelectorAll("[data-ui]").forEach(b=>b.onclick=()=>{ui=b.dataset.ui;ls("mbq-ui",ui);applyUI()});

/* ---------- editor ---------- */
function renderHead(){$("#fClient").value=cur.client;$("#fDate").value=cur.date;$("#fCur").value=cur.currency;$("#fFb").value=cur.fb;
  document.querySelectorAll("[data-ql]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.ql===cur.lang)));
  const bar=$("#editingBar");bar.hidden=!cur.id;if(cur.id)$("#editingTxt").textContent=t("editing",cur.client||"—")}
function renderItems(){

    el.classList.toggle("bad",!!s.msg);el.querySelector("[data-lt]").textContent=s.ok?fmt(s.t):"—";

function renderNotes(){

function renderEditor(){renderHead();renderItems();renderNotes()}

$("#items").addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;const i=+e.target.closest(".item").dataset.i;cur.items[i][k]=e.target.value;refreshRows();persist()});

$("#notes").addEventListener("click",e=>{if(!e.target.closest("[data-ndel]"))return;cur.notes.splice(+e.target.closest(".note").dataset.i,1);renderNotes();persist()});
$("#btnAddNote").onclick=()=>{cur.notes.push("");renderNotes();persist();document.getElementById("nt-"+(cur.notes.length-1)).focus()};
[["#fClient","client"],["#fDate","date"],["#fCur","currency"],["#fFb","fb"]].forEach(([s,k])=>$(s).addEventListener("input",e=>{cur[k]=e.target.value;persist();if(k==="client"&&cur.id)renderHead()}));
document.querySelectorAll("[data-ql]").forEach(b=>b.onclick=()=>{
  const to=b.dataset.ql,from=cur.lang;if(to===from)return;cur.lang=to;
  if(cur.currency===CUR[from])cur.currency=CUR[to];
  cur.notes=cur.notes.map(n=>{const i=NOTES[from].indexOf(n);return i>=0?NOTES[to][i]:n});
  persist();renderEditor();if(!$("#v-prev").hidden)renderPreview()});
function startNew(){const last=saved.find(q=>(q.lang||"ar")===cur.lang);cur=blank(cur.lang,last&&last.notes);persist();renderEditor();window.scrollTo(0,0);toast(t("newReady"))}
$("#btnNew").onclick=startNew;$("#btnNew2").onclick=startNew;
$("#btnPreview").onclick=()=>show("prev");

/* ---------- quote sheet ---------- */
function paperHTML(q){
  const L=SHEET[q.lang||"ar"],dir=q.lang==="en"?"ltr":"rtl";
  const rows=q.items.map(rowState).map((s,i)=>({s,it:q.items[i]})).filter(x=>x.s.ok);
  const total=rows.reduce((a,x)=>a+x.s.t,0);
  const notes=(q.notes||[]).map(n=>(n||"").trim()).filter(Boolean);
  return `<div class="paper" dir="${dir}" lang="${q.lang||"ar"}"><div class="frame"></div>
   <div class="hd"><div></div>
    <div class="ttl"><div class="a">${L.title}</div><div class="b">MB SYSTEM</div><div class="c">SECURITY SOLUTIONS</div></div>
    <div class="lg"><img src="${LOGO}" alt=""></div></div>
   <div class="main">
   <div class="meta"><div>${L.client}<b>${esc(q.client)}</b></div><div>${L.date}<b style="direction:ltr;display:inline-block">${esc(dmy(q.date))}</b></div></div>
   <div class="greet">${L.greet}</div>
   <table><thead><tr><th style="width:7%">${L.no}</th><th>${L.desc}</th><th style="width:11%">${L.qty}</th><th style="width:16%">${L.price}</th><th style="width:18%">${L.total}</th></tr></thead>
   <tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="d" dir="auto">${esc(x.it.d)}</td><td class="num">${x.s.q.toLocaleString("en-US")}</td><td class="num">${fmt(x.s.p)}</td><td class="num">${fmt(x.s.t)}</td></tr>`).join("")}</tbody></table>
   <div class="tot"><span class="l">${L.total}</span><span class="v">${fmt(total)}<small>${esc(q.currency)}</small></span></div>
   ${notes.length?`<div class="nt"><h4>${L.notes}</h4>${notes.map(n=>`<p dir="auto">${esc(n)}</p>`).join("")}</div>`:""}
   </div>
   <div class="ft">
    <div class="c1"><div class="lab">${L.contact}</div>${PHONES.map(p=>`<div class="ph">${p}</div>`).join("")}<a href="${FB_URL}" target="_blank" rel="noopener">${esc(q.fb||"MB Systems")}</a></div>
    <div class="c2"><div class="s">${L.regards}</div><div class="bn">MB Systems</div><div class="s" style="font-family:Arial,sans-serif">Security Solutions</div></div>
   </div></div>`;
}
/* Fit the content inside one A4 page: shrink text if it overflows, fill spare room with empty table rows */
function fitPaper(el){
  const main=el.querySelector(".main"),ft=el.querySelector(".ft"),tb=el.querySelector("tbody");
  const room=()=>ft.offsetTop-(main.offsetTop+main.offsetHeight)-14;
  let k=1;el.style.setProperty("--k",k);
  while(room()<0&&k>0.55){k=Math.round((k-0.04)*100)/100;el.style.setProperty("--k",k)}
  const tr=document.createElement("tr");tr.className="blank";tr.innerHTML="<td></td><td></td><td></td><td></td><td></td>";
  tb.appendChild(tr);const h=tr.offsetHeight;tr.remove();
  const real=tb.rows.length;let n=Math.floor(room()/h);n=Math.max(0,Math.min(n,15-real));
  for(let i=0;i<n;i++)tb.appendChild(tr.cloneNode(true));
}
function mountSheet(host){host.innerHTML=paperHTML(cur);const p=host.firstElementChild;fitPaper(p);return p}
function renderPreview(){$("#driveBox").hidden=true;mountSheet($("#pvscale"));fitPreview()}
function fitPreview(){const wrap=$("#pvwrap"),el=$("#pvscale"),p=el.firstElementChild;if(!p)return;
  const s=Math.min(1,(wrap.clientWidth-20)/p.offsetWidth);el.style.transform=`scale(${s})`;wrap.style.height=(p.offsetHeight*s+20)+"px"}
addEventListener("resize",()=>{if(!$("#v-prev").hidden)fitPreview()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$("#v-prev").hidden)renderPreview()});

/* ---------- save ---------- */
function validate(){
  const c=calc();
  if(!cur.client.trim()){toast(t("needClient"));show("edit");$("#fClient").focus();return null}
  if(c.bad){toast(t("fixMissing"));show("edit");return null}
  if(!c.count){toast(t("needItem"));show("edit");return null}
  return c;
}
function saveQuote(silent){
  const c=validate();if(!c)return false;
  const body={id:cur.id||("q"+Date.now()),lang:cur.lang,client:cur.client.trim(),date:cur.date,currency:cur.currency,fb:cur.fb,
    items:cur.items.filter(it=>!rowState(it).empty).map(it=>({d:it.d.trim(),q:String(it.q),p:String(it.p)})),
    notes:cur.notes.filter(n=>(n||"").trim()),total:c.total,savedAt:new Date().toISOString()};
  const all=ls("mbq-saved")||[];const i=all.findIndex(x=>x.id===body.id);if(i>=0)all[i]=body;else all.unshift(body);
  if(!writeAll(all))return false;
  saved=all;cur.id=body.id;persist();renderHead();renderList();if(!silent)toast(t("saved",body.client));pushQuote(body,!silent);return true;
}
$("#btnSave").onclick=()=>saveQuote(false);

/* ---------- export ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
const safeName=()=>(cur.client||"").replace(/[\\/:*?"<>|\n\r\t]+/g," ").replace(/\s+/g," ").trim()||"Quote";
async function renderCanvas(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  try{await document.fonts.ready}catch(e){}
  const p=mountSheet($("#sheetHost"));
  const c=await html2canvas(p,{scale:2.5,backgroundColor:"#ffffff",logging:false});
  return c;
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shareFile(blob,name,type){
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name.replace(/\.\w+$/,"")});return}catch(e){if(e&&e.name==="AbortError")return}
  }
  downloadBlob(blob,name);toast(t("downloaded"));
}
async function busy(btn,fn){const label=btn.textContent;btn.disabled=true;btn.textContent=t("preparing");try{await fn()}catch(e){console.error(e);toast(navigator.onLine?t("prepFail"):t("needNet"))}finally{btn.disabled=false;btn.textContent=label}}
async function makePdf(){
  const c=await renderCanvas();
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4"});
  pdf.setProperties({title:safeName()});
  pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,210,297);
  return pdf.output("blob");
}
async function blobB64(b){const u=new Uint8Array(await b.arrayBuffer());let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
async function toDrive(blob,name){if(!IS_GAS)return;try{const url=await gasRun("apiSaveFile",name,blob.type,await blobB64(blob));if(url){$("#driveLink").href=url;$("#driveBox").hidden=false}}catch(e){console.error(e)}}
$("#btnShare").onclick=e=>{if(!saveQuote(true))return;busy(e.currentTarget,async()=>{const b=await makePdf();await toDrive(b,safeName()+".pdf");await shareFile(b,safeName()+".pdf","application/pdf")})};
$("#btnPng").onclick=e=>{if(!saveQuote(true))return;busy(e.currentTarget,async()=>{const c=await renderCanvas();const b=await new Promise(r=>c.toBlob(r,"image/png"));await toDrive(b,safeName()+".png");await shareFile(b,safeName()+".png","image/png")})};
$("#btnPrint").onclick=()=>{if(!saveQuote(true))return;mountSheet($("#sheetHost"));const old=document.title;document.title=safeName();
  const restore=()=>{document.title=old;removeEventListener("afterprint",restore)};addEventListener("afterprint",restore);setTimeout(()=>window.print(),60)};
$("#btnCopy").onclick=async()=>{
  const L=SHEET[cur.lang];
  const lines=[`*${L.title.replace(/ـ/g,"")} - MB System*`,`${L.client.replace(/[\/:]/g,"").trim()}: ${cur.client}`,`${L.date.replace(":","")}: ${dmy(cur.date)}`,""];
  let i=0;cur.items.forEach(it=>{const s=rowState(it);if(s.ok)lines.push(`${++i}. ${it.d.trim()} — ${s.q} × ${fmt(s.p)} = ${fmt(s.t)}`)});
  lines.push("",`*${L.total}: ${fmt(calc().total)} ${cur.currency}*`);
  const n=cur.notes.map(x=>(x||"").trim()).filter(Boolean);if(n.length){lines.push("",L.notes);n.forEach(x=>lines.push("- "+x))}
  lines.push("",`${L.contact} ${PHONES.join(" / ")}`);
  const txt=lines.join("\n");
  try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(t("copied"))}catch(_){toast(t("copyFail"))}a.remove()}
};
$("#btnBack").onclick=()=>show("edit");

/* ---------- storage (this device) ---------- */
const SEED={"id": "nagy-2026-10-04", "lang": "ar", "client": "Nagy", "date": "2026-10-04", "currency": "جنيه مصري", "fb": "MB Systems", "items": [{"d": "Cam 2M Hikvision IP", "q": "5", "p": "1750"}, {"d": "Cam 6M Hikvision IP", "q": "2", "p": "2800"}, {"d": "NVR 8 Port Up to 8M", "q": "1", "p": "6300"}, {"d": "HDD 1TB Purple", "q": "1", "p": "2700"}, {"d": "Switch 8 Port POE", "q": "1", "p": "1800"}, {"d": "Cable Cat 6", "q": "1", "p": "3300"}, {"d": "Rack 6U", "q": "1", "p": "2000"}, {"d": "Box 10*10 Waterproof", "q": "7", "p": "75"}, {"d": "RJ", "q": "20", "p": "5"}, {"d": "installation", "q": "7", "p": "500"}], "notes": ["يرجي العلم أن هذه الأسعار بتاريخ 2/10/2026  و قابلة للزيادة في حاله تغير الاسعار قبل الحجز", "يرجي العلم أن هذا الأسعار لا تشمل ( شاشة ـ داكتات ـ خراطيم فليكسيبل - و اي مستلزمات تثبيت )"], "total": 34575, "savedAt": "2026-10-04T09:02:08.000Z"};
function writeAll(all){all.sort((a,b)=>(b.savedAt||"").localeCompare(a.savedAt||""));if(!ls("mbq-saved",all)){toast(t("storeFail"));return false}return true}
function initStore(){
  let all=ls("mbq-saved");if(!all){all=[SEED];writeAll(all)}
  saved=all;renderList();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
/* ---------- Google Sheet sync ---------- */
const IS_GAS=typeof google!=="undefined"&&!!(google.script&&google.script.run);
function gasRun(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
const sheetUrl=()=>IS_GAS?"gas":(ls("mbq-sheet")||"").trim();
function setSync(state,msg){const el=$("#syncState");el.className="sync"+(state==="ok"?" on":state==="err"?" err":"");el.lastElementChild.textContent=msg||t(state==="ok"?"syncOk":state==="err"?"syncErr":"syncOff")}
async function sheetCall(payload,get){
  if(IS_GAS){const j=get?await gasRun("apiList"):payload.action==="delete"?await gasRun("apiDelete",payload.id):await gasRun("apiSave",payload.quote);if(!j||!j.ok)throw new Error("bad");return j}
  const url=sheetUrl();if(!url)throw new Error("nourl");
  const r=get?await fetch(url+(url.includes("?")?"&":"?")+"action=list&t="+Date.now())
             :await fetch(url,{method:"POST",body:JSON.stringify(payload)});
  const j=await r.json();if(!j||!j.ok)throw new Error("bad");return j;
}
function markSynced(id,ok){const all=ls("mbq-saved")||[];const q=all.find(x=>x.id===id);if(q){q.synced=ok;writeAll(all);saved=all;renderList()}}
async function pushQuote(q,announce){
  if(!sheetUrl())return;
  try{const body={...q};delete body.synced;await sheetCall({action:"save",quote:body});markSynced(q.id,true);setSync("ok");if(announce)toast(t("sheetSaved"))}
  catch(e){markSynced(q.id,false);setSync("err");if(announce)toast(t("sheetFail"))}
}
async function syncAll(announce){
  if(!sheetUrl()){setSync("off");return}
  setSync("",t("syncing"));
  try{
    const j=await sheetCall(null,true);let all=ls("mbq-saved")||[];let down=0,up=0;
    (j.quotes||[]).forEach(r=>{if(!r||!r.id)return;const i=all.findIndex(x=>x.id===r.id);
      if(i<0){all.push({...r,synced:true});down++}
      else if((r.savedAt||"")>(all[i].savedAt||"")){all[i]={...r,synced:true};down++}
      else if((r.savedAt||"")===(all[i].savedAt||""))all[i].synced=true});
    const remote=new Set((j.quotes||[]).map(r=>r.id));
    const toPush=all.filter(x=>x.synced===false||(!remote.has(x.id)&&x.synced!==true));
    writeAll(all);saved=all;renderList();
    for(const q of toPush){const body={...q};delete body.synced;await sheetCall({action:"save",quote:body});q.synced=true;up++}
    writeAll(all);saved=all;renderList();setSync("ok");if(announce)toast(t("synced",up,down));
  }catch(e){setSync("err");if(announce)toast(t("linkFail"))}
}
$("#btnSheetSave").onclick=async()=>{ls("mbq-sheet",$("#fSheet").value.trim());if(!sheetUrl()){setSync("off");return}
  try{await sheetCall(null,true);toast(t("linked"));syncAll(false)}catch(e){setSync("err");toast(t("linkFail"))}};
$("#btnSync").onclick=()=>syncAll(true);

/* ---------- Excel export ---------- */
$("#btnExcel").onclick=e=>busy(e.currentTarget,async()=>{
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=XLSX.utils.book_new();const used=new Set(["العروض"]);
  const nameFor=q=>{let b=(q.client||"Quote").replace(/[\[\]\*\?\/\\:]/g," ").trim().slice(0,24)||"Quote";let n=b,i=2;while(used.has(n)){n=`${b} (${i++})`}used.add(n);return n};
  const index=[["العميل","التاريخ","الإجمالي","العملة","اللغة","عدد البنود","آخر حفظ","التاب"]];
  const tabs=[];
  saved.forEach(q=>{const tab=nameFor(q);const L=SHEET[q.lang||"ar"];
    index.push([q.client,dmy(q.date),q.total,q.currency,q.lang==="en"?"English":"عربي",(q.items||[]).length,when(q.savedAt),tab]);
    const rows=[[L.title.replace(/ـ/g,"")+" - MB System"],[],[L.client.replace(/[\/:]/g,"").trim(),q.client],[L.date.replace(":",""),dmy(q.date)],[],[L.no,L.desc,L.qty,L.price,L.total]];
    let k=0;(q.items||[]).forEach(it=>{const s=rowState(it);if(s.ok)rows.push([++k,it.d,s.q,s.p,s.t])});
    rows.push([],["",L.total,"","",q.total],["","",""," ",q.currency]);
    const n=(q.notes||[]).filter(Boolean);if(n.length){rows.push([],[L.notes]);n.forEach(x=>rows.push(["",x]))}
    const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:5},{wch:46},{wch:9},{wch:13},{wch:15}];
    if(q.lang!=="en")ws["!views"]=[{RTL:true}];tabs.push([ws,tab])});
  const wi=XLSX.utils.aoa_to_sheet(index);wi["!cols"]=[{wch:24},{wch:12},{wch:13},{wch:12},{wch:9},{wch:10},{wch:18},{wch:24}];wi["!views"]=[{RTL:true}];
  XLSX.utils.book_append_sheet(wb,wi,"العروض");tabs.forEach(([ws,n])=>XLSX.utils.book_append_sheet(wb,ws,n));
  wb.Workbook={Views:[{RTL:true}]};
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  await shareFile(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`MB-Quotes-${today()}.xlsx`,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
});

$("#btnBackup").onclick=()=>{const blob=new Blob([JSON.stringify({app:"mb-quotes",v:2,exported:new Date().toISOString(),quotes:saved},null,1)],{type:"application/json"});
  shareFile(blob,`MB-Quotes-Backup-${today()}.json`,"application/json")};
$("#btnRestore").onclick=()=>$("#fRestore").click();
$("#fRestore").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.quotes;if(!Array.isArray(list))throw 0;
  const all=ls("mbq-saved")||[];let n=0;list.forEach(q=>{if(!q||!q.id||!q.client)return;const i=all.findIndex(x=>x.id===q.id);if(i>=0)all[i]=q;else all.push(q);n++});
  writeAll(all);saved=all;renderList();toast(t("restored",n))}catch(err){toast(t("badBackup"))}e.target.value=""};

/* ---------- archive ---------- */
function when(iso){try{const d=new Date(iso);return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function renderList(){
  const q=filter.trim().toLowerCase();
  const rows=saved.filter(x=>!q||(x.client||"").toLowerCase().includes(q));
  if(!saved.length){$("#list").innerHTML=`<div class="empty"><strong>${t("emptyT")}</strong>${t("emptyB")}</div>`;return}
  if(!rows.length){$("#list").innerHTML=`<div class="empty"><strong>${t("noRes")}</strong>${t("noResB")}</div>`;return}
  $("#list").innerHTML=rows.map(x=>`<div class="q" data-id="${esc(x.id)}" role="button" tabindex="0">
    <div class="nm">${esc(x.client)}<span class="tag">${x.lang==="en"?"EN":"ع"}</span>${sheetUrl()&&x.synced===false?`<span class="tag" style="color:var(--danger)">${t("pending")}</span>`:""}</div><div class="am">${fmt(x.total)} <span class="meta">${esc(x.currency||"")}</span></div>
    <div class="meta">${esc(t("quoteOf",dmy(x.date)))} · ${esc(t("itemsN",(x.items||[]).length))}</div><div class="meta">${esc(t("lastSave",when(x.savedAt)))}</div>
    <div class="acts">
     ${pendingDelete===x.id?`<span class="confirm">${t("delQ")} <button class="btn danger" data-a="del-yes">${t("delYes")}</button><button class="btn ghost" data-a="del-no">${t("cancel")}</button></span>`:
     `<button class="btn navy" data-a="open">${t("open")}</button><button class="btn ghost" data-a="view">${t("view")}</button><button class="btn ghost" data-a="dup">${t("dup")}</button><button class="btn ghost" data-a="del">${t("del")}</button>`}
    </div></div>`).join("");
}
function loadQuote(x,asCopy){cur={id:asCopy?null:x.id,lang:x.lang||"ar",client:asCopy?"":x.client,date:asCopy?today():x.date,currency:x.currency||CUR[x.lang||"ar"],fb:x.fb||"MB Systems",
  items:(x.items||[]).map(i=>({d:i.d||"",q:String(i.q??""),p:String(i.p??"")})),notes:(x.notes||[]).slice()};
  if(!cur.items.length)cur.items.push({d:"",q:"",p:""});persist();renderEditor()}
$("#list").addEventListener("click",e=>{
  const card=e.target.closest(".q");if(!card)return;const x=saved.find(s=>s.id===card.dataset.id);if(!x)return;
  const a=e.target.closest("[data-a]")?.dataset.a||"open";
  if(a==="open"){loadQuote(x);show("edit");toast(t("opened",x.client))}
  else if(a==="view"){loadQuote(x);show("prev")}
  else if(a==="dup"){loadQuote(x,true);show("edit");toast(t("dupDone"));$("#fClient").focus()}
  else if(a==="del"){pendingDelete=x.id;renderList()}
  else if(a==="del-no"){pendingDelete=null;renderList()}
  else if(a==="del-yes"){pendingDelete=null;sheetCall({action:"delete",id:x.id}).catch(()=>{});const all=saved.filter(s=>s.id!==x.id);writeAll(all);saved=all;if(cur.id===x.id){cur.id=null;persist();renderHead()}renderList();toast(t("deleted"))}
});
$("#list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("q"))e.target.click()});
$("#fSearch").addEventListener("input",e=>{filter=e.target.value;renderList()});

/* ---------- tabs / toast ---------- */
function show(v){["edit","prev","arch"].forEach(k=>{$("#v-"+k).hidden=k!==v});
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  window.scrollTo(0,0);if(v==="prev")renderPreview()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.v));
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}

$("#hdLogo").src=LOGO;
if(IS_GAS){$("#fSheet").closest("label").hidden=true;$("#btnSheetSave").hidden=true;const h=document.querySelector('[data-t="sheetHint"]');h.dataset.t="gasHint"}
initStore();applyUI();$("#fSheet").value=IS_GAS?"":sheetUrl();setSync(sheetUrl()?"":"off",sheetUrl()?t("syncing"):undefined);if(sheetUrl())syncAll(false);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
